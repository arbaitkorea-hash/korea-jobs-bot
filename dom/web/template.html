<title>Дом · Нячанг</title>
<meta name="description" content="Частная вилла над заливом Нячанг: пять комнат премиального сервиса.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #ede5d6;
    --muted: #b9ae9a;
    --faint: #9f957f;
    --brass: #d4ad63;
    --brass-soft: rgba(212, 173, 99, 0.16);
    --lagoon: #081619;
    --panel: rgba(6, 20, 23, 0.78);
    --line: rgba(237, 229, 214, 0.16);
    --display: "Cormorant Garamond", Georgia, serif;
    --body: "Manrope", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --gutter: 16px;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--lagoon);
    color: var(--ink);
    font: 15px/1.55 var(--body);
    overflow: hidden;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 6px; }

  .ui {
    position: fixed; inset: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding-inline: max(var(--gutter), 2.4vw);
    padding-block: calc(env(safe-area-inset-top, 0px) + 18px) calc(env(safe-area-inset-bottom, 0px) + 16px);
    pointer-events: none;
  }
  .ui > * { pointer-events: auto; }

  /* ---------- top bar ---------- */
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .mark { display: grid; gap: 2px; text-shadow: 0 1px 18px rgba(0,0,0,.45); }
  .mark b { font: 400 30px/1 var(--display); letter-spacing: .5em; margin-right: -.5em; }
  .mark span { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 18px; border-radius: 0;
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap;
  }
  .chip:hover { border-color: rgba(212,173,99,.6); }
  #basketBtn { border-color: var(--brass); color: var(--brass); }
  .chip .count { font-family: var(--mono); color: var(--brass); }
  .chip[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }

  /* ---------- room card ---------- */
  .stage { position: relative; min-height: 0; }
  .card {
    position: absolute; right: 0; top: 18px; bottom: 18px;
    width: min(390px, 100%);
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 0;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    overflow: hidden;
    transition: opacity .5s ease, transform .5s ease;
  }
  .card.swap { opacity: 0; transform: translateY(8px); }
  .card-head { padding: 22px 24px 14px; border-bottom: 1px solid var(--line); }
  .eyebrow { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--brass); }
  .card h1 { font: 300 46px/1 var(--display); margin: 8px 0 10px; text-wrap: balance; }
  .card-head p { margin: 0; color: var(--muted); font-size: 14px; }
  .card-toggle { display: none; }
  .card-body { overflow-y: auto; padding: 8px 24px 20px; display: grid; gap: 0; }
  .svc { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .svc:last-child { border-bottom: 0; }
  .svc h3 { margin: 0; font: 400 22px/1.15 var(--display); }
  .svc .what { grid-column: 1 / 2; color: var(--muted); font-size: 13px; }
  .svc .std { grid-column: 1 / -1; font-size: 12px; color: var(--faint); }
  .svc .price { font-family: var(--mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .svc .price small { display: block; color: var(--faint); font-size: 11px; }
  .add {
    grid-column: 2; grid-row: 2; justify-self: end; align-self: start;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 7px 12px; border-radius: 0;
    border: 1px solid rgba(212,173,99,.55); color: var(--brass);
  }
  .add:hover { background: var(--brass-soft); }
  .add[aria-pressed="true"] { background: var(--brass); color: #15110a; border-color: var(--brass); }
  .note { font-size: 12px; color: var(--faint); margin: 14px 0 0; }
  .intro p { color: var(--ink); font-size: 15px; margin: 14px 0 0; max-width: 60ch; }
  .intro ul { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .intro li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; font-size: 13px; color: var(--muted); }
  .intro li b { color: var(--ink); font-weight: 400; font-family: var(--display); font-size: 19px; line-height: 1.2; }

  /* ---------- bottom bar ---------- */
  .bottom { display: grid; gap: 12px; }
  .rooms {
    display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 0;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: 0; width: max-content; max-width: 100%; gap: 0;
  }
  .rooms::-webkit-scrollbar { display: none; }
  .room-btn {
    display: grid; gap: 2px; text-align: left;
    padding: 12px 24px 14px; border-radius: 0; white-space: nowrap;
    border-right: 1px solid var(--line);
    font-family: var(--display); font-size: 22px; line-height: 1.1; color: var(--muted);
  }
  .room-btn:last-child { border-right: 0; }
  .room-btn small { font: 500 10px/1.4 var(--body); letter-spacing: .2em; text-transform: uppercase; color: var(--faint); }
  .room-btn:hover { color: var(--ink); }
  .room-btn[aria-current="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--brass); }
  .room-btn[aria-current="true"] small { color: var(--brass); }

  .clock { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .clock-panel {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 0;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: 6px 16px 6px 6px; flex: 1 1 320px; max-width: 560px;
  }
  .play { width: 34px; height: 34px; border-radius: 0; border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
  .play svg { width: 12px; height: 12px; fill: var(--ink); }
  .time { font-family: var(--mono); font-size: 15px; min-width: 48px; font-variant-numeric: tabular-nums; }
  .phase { font-size: 12px; color: var(--muted); min-width: 64px; }
  #hour { flex: 1; min-width: 80px; accent-color: var(--brass); }

  /* ---------- basket ---------- */
  .basket {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 70px); right: max(var(--gutter), 2.4vw);
    width: min(360px, calc(100% - 2 * var(--gutter)));
    background: rgba(6, 20, 23, 0.95); border: 1px solid var(--line); border-radius: 0;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    padding: 20px 22px; z-index: 5; display: grid; gap: 12px;
    max-height: calc(100% - 180px); overflow-y: auto;
  }
  .basket h2 { font: 300 32px/1.05 var(--display); margin: 0; }
  .steppers { display: flex; gap: 10px; flex-wrap: wrap; }
  .stepper { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 0; padding: 4px 6px 4px 12px; font-size: 13px; color: var(--muted); }
  .stepper output { font-family: var(--mono); color: var(--ink); min-width: 18px; text-align: center; }
  .stepper button { width: 26px; height: 26px; border-radius: 0; border: 1px solid var(--line); line-height: 1; }
  .lines { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .lines li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: baseline; font-size: 13px; }
  .lines .room { color: var(--faint); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; display: block; }
  .lines .sum { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .lines .rm { color: var(--faint); font-size: 16px; padding: 0 4px; }
  .totals { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .totals div { display: flex; justify-content: space-between; gap: 12px; }
  .totals .grand { color: var(--ink); font-size: 17px; }
  .totals span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 13px; margin: 0; }
  .primary { background: var(--brass); color: #15110a; border-radius: 0; padding: 15px 18px; font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  .primary:hover { filter: brightness(1.08); }
  .copied { font-size: 12px; color: var(--brass); min-height: 1em; margin: 0; }
  textarea.fallback { width: 100%; min-height: 120px; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: 12px/1.4 var(--mono); }

  .nowebgl { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; background: radial-gradient(120% 80% at 50% 110%, #c9774a 0%, #3b2c4a 38%, #07181b 75%); }

  @media (max-width: 760px) {
    .mark b { font-size: 24px; }
    .room-btn { font-size: 18px; padding: 10px 16px 12px; }
    .card {
      top: auto; bottom: 8px; left: 0; right: 0; width: auto;
      max-height: 46vh;
    }
    .card.collapsed .card-body, .card.collapsed .card-head p { display: none; }
    .card-head { padding: 16px 18px 12px; display: grid; grid-template-columns: 1fr auto; gap: 0 10px; }
    .card-head > :not(.card-toggle) { grid-column: 1; }
    .card-toggle { display: block; grid-column: 2; grid-row: 1 / span 2; align-self: start; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 0; padding: 6px 10px; }
    .card h1 { font-size: 32px; margin: 6px 0 6px; }
    .card-body { padding: 4px 18px 16px; }
    .phase { display: none; }
    .clock-panel { max-width: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
</style>

<canvas id="scene" aria-label="Трёхмерная вилла Дом над заливом Нячанг"></canvas>

<div class="ui">
  <header class="top">
    <div class="mark"><b>ДОМ</b><span>Частная вилла · Нячанг</span></div>
    <div class="top-actions">
      <button class="chip" id="soundBtn" aria-pressed="false">Звук моря</button>
      <button class="chip" id="basketBtn" aria-expanded="false" aria-controls="basket">Пребывание <span class="count" id="basketCount">0</span></button>
    </div>
  </header>

  <main class="stage">
    <article class="card" id="card" aria-live="polite"></article>
  </main>

  <footer class="bottom">
    <nav class="rooms" id="rooms" aria-label="Комнаты Дома"></nav>
    <div class="clock">
      <div class="clock-panel">
        <button class="play" id="playBtn" aria-label="Пауза"><svg viewBox="0 0 12 12" id="playIcon"><rect x="1" y="1" width="3.5" height="10"/><rect x="7.5" y="1" width="3.5" height="10"/></svg></button>
        <span class="time" id="timeLabel">20:40</span>
        <span class="phase" id="phaseLabel">ночь</span>
        <input type="range" id="hour" min="5" max="23.9" step="0.05" value="20.66" aria-label="Время суток">
      </div>
    </div>
  </footer>
</div>

<section class="basket" id="basket" hidden aria-label="Пребывание">
  <h2>Ваше пребывание</h2>
  <div class="steppers">
    <div class="stepper">Гостей <button data-step="guests" data-d="-1" aria-label="Меньше гостей">−</button><output id="guestsOut">2</output><button data-step="guests" data-d="1" aria-label="Больше гостей">+</button></div>
    <div class="stepper">Ночей <button data-step="nights" data-d="-1" aria-label="Меньше ночей">−</button><output id="nightsOut">5</output><button data-step="nights" data-d="1" aria-label="Больше ночей">+</button></div>
  </div>
  <ul class="lines" id="lines"></ul>
  <p class="empty" id="emptyNote">Пока пусто. Откройте комнату и нажмите «Добавить» у нужной услуги.</p>
  <div class="totals" id="totals" hidden>
    <div><span>Услуги</span><span id="subTotal"></span></div>
    <div><span>Сервисный сбор Дома 10%</span><span id="feeTotal"></span></div>
    <div class="grand"><span>Итого</span><span id="grandTotal"></span></div>
  </div>
  <button class="primary" id="copyBtn">Скопировать заявку для менеджера</button>
  <p class="copied" id="copied"></p>
  <p class="note">Цены ориентировочные. Точную стоимость менеджер подтвердит у партнёров.</p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const ROOMS = __DATA__;

const STAY_MOMENT = {
  hall: "Прибытие и отъезд",
  suites: "Жизнь на вилле",
  dining: "Вечер",
  pier: "Море",
  terrace: "Впечатления",
};
const UNIT = {
  per_night: "ночь", per_person: "гость", per_trip: "поездка",
  per_hour: "час", per_booking: "бронь", per_event: "ивент",
};
const fmt = n => Math.round(n).toLocaleString("ru-RU").replace(/,/g, " ") + " $";
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ============================== UI ============================== */
const state = { room: "home", guests: 2, nights: 5, basket: [] };
try {
  const saved = JSON.parse(localStorage.getItem("dom-stay") || "null");
  if (saved) Object.assign(state, { guests: saved.guests, nights: saved.nights, basket: saved.basket || [] });
} catch (e) {}
const save = () => { try { localStorage.setItem("dom-stay", JSON.stringify({ guests: state.guests, nights: state.nights, basket: state.basket })); } catch (e) {} };

const providers = {};
ROOMS.forEach(r => r.providers.forEach(p => { providers[p.id] = { ...p, room: r.room_name }; }));
const ORDER = ["home", ...ROOMS.map(r => r.room_id)];

function qtyFor(p) {
  switch (p.unit) {
    case "per_night": return state.nights;
    case "per_person": return state.guests;
    case "per_hour": return p.min_hours || 1;
    default: return 1;
  }
}
function qtyLabel(p) {
  const q = qtyFor(p);
  const words = { per_night: "ноч.", per_person: "гост.", per_hour: "ч", per_trip: "поездка", per_booking: "бронь", per_event: "ивент" };
  return `${q} ${words[p.unit] || ""}`;
}

const roomsNav = document.getElementById("rooms");
ORDER.forEach(id => {
  const b = document.createElement("button");
  b.className = "room-btn";
  b.dataset.room = id;
  const small = document.createElement("small");
  small.textContent = id === "home" ? "Обзор" : STAY_MOMENT[id];
  b.append(small, id === "home" ? "Дом" : ROOMS.find(r => r.room_id === id).room_name);
  b.addEventListener("click", () => goTo(id));
  roomsNav.appendChild(b);
});

const card = document.getElementById("card");
function renderCard() {
  const id = state.room;
  let html;
  if (id === "home") {
    html = `
      <div class="card-head">
        <div class="eyebrow">Нячанг · залив Камрань · по приглашению</div>
        <h1>Вилла, где о вас уже позаботились</h1>
        <button class="card-toggle" type="button">Свернуть</button>
        <p>От трапа самолёта до последнего вечера на яхте — пять комнат Дома, один управляющий и ни одной очереди.</p>
      </div>
      <div class="card-body intro">
        <ul>
          ${ROOMS.map(r => `<li><b>${r.room_name}</b><span>${r.room_description}</span></li>`).join("")}
        </ul>
        <p class="note">Выберите комнату внизу, листайте колёсиком или стрелками. Ползунок времени меняет свет: в Нячанге солнце встаёт из моря и садится за горами.</p>
      </div>`;
  } else {
    const r = ROOMS.find(x => x.room_id === id);
    const idx = ORDER.indexOf(id);
    html = `
      <div class="card-head">
        <div class="eyebrow">Комната ${idx} из ${ROOMS.length} · ${STAY_MOMENT[id] || ""}</div>
        <h1>${r.room_name}</h1>
        <button class="card-toggle" type="button">Свернуть</button>
        <p>${r.room_description}</p>
      </div>
      <div class="card-body">
        ${r.providers.map(p => {
          const inBasket = state.basket.includes(p.id);
          return `<div class="svc">
            <h3>${p.name}</h3>
            <div class="price">от ${fmt(p.price)}<small>за ${UNIT[p.unit] || p.unit}</small></div>
            <div class="what">${p.service}</div>
            <button class="add" data-id="${p.id}" aria-pressed="${inBasket}">${inBasket ? "В пребывании" : "Добавить"}</button>
            ${p.standard ? `<div class="std">Стандарт Дома: ${p.standard}</div>` : ""}
          </div>`;
        }).join("")}
        <p class="note">Цены ориентировочные, в долларах США.</p>
      </div>`;
  }
  card.innerHTML = html;
  card.querySelectorAll(".add").forEach(b => b.addEventListener("click", () => toggleItem(b.dataset.id)));
  const t = card.querySelector(".card-toggle");
  t.addEventListener("click", () => {
    card.classList.toggle("collapsed");
    t.textContent = card.classList.contains("collapsed") ? "Открыть" : "Свернуть";
  });
  roomsNav.querySelectorAll(".room-btn").forEach(b => b.setAttribute("aria-current", b.dataset.room === id));
}

function toggleItem(id) {
  const i = state.basket.indexOf(id);
  if (i >= 0) state.basket.splice(i, 1); else state.basket.push(id);
  save(); renderCard(); renderBasket();
}

const basketEl = document.getElementById("basket");
const basketBtn = document.getElementById("basketBtn");
basketBtn.addEventListener("click", () => {
  basketEl.hidden = !basketEl.hidden;
  basketBtn.setAttribute("aria-expanded", String(!basketEl.hidden));
});
basketEl.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => {
  const k = b.dataset.step;
  const max = k === "guests" ? 20 : 30;
  state[k] = Math.min(max, Math.max(1, state[k] + Number(b.dataset.d)));
  save(); renderBasket();
}));

function basketTotals() {
  const items = state.basket.map(id => providers[id]).filter(Boolean);
  const sub = items.reduce((s, p) => s + p.price * qtyFor(p), 0);
  return { items, sub, fee: sub * 0.1, total: sub * 1.1 };
}
function renderBasket() {
  document.getElementById("guestsOut").textContent = state.guests;
  document.getElementById("nightsOut").textContent = state.nights;
  const { items, sub, fee, total } = basketTotals();
  document.getElementById("basketCount").textContent = items.length;
  document.getElementById("lines").innerHTML = items.map(p => `
    <li><span><span class="room">${p.room}</span>${p.name}</span>
    <span class="sum">${qtyLabel(p)} · ${fmt(p.price * qtyFor(p))}</span>
    <button class="rm" data-id="${p.id}" aria-label="Убрать ${p.name}">×</button></li>`).join("");
  document.querySelectorAll("#lines .rm").forEach(b => b.addEventListener("click", () => toggleItem(b.dataset.id)));
  document.getElementById("emptyNote").hidden = items.length > 0;
  document.getElementById("totals").hidden = items.length === 0;
  document.getElementById("subTotal").textContent = fmt(sub);
  document.getElementById("feeTotal").textContent = fmt(fee);
  document.getElementById("grandTotal").textContent = fmt(total);
}

document.getElementById("copyBtn").addEventListener("click", () => {
  const { items, sub, fee, total } = basketTotals();
  const out = document.getElementById("copied");
  if (!items.length) { out.textContent = "Добавьте хотя бы одну услугу."; return; }
  const text = [
    "Заявка — ДОМ, Нячанг",
    `Гостей: ${state.guests}, ночей: ${state.nights}`,
    "",
    ...items.map(p => `${p.room} — ${p.name} (${qtyLabel(p)}): ${fmt(p.price * qtyFor(p))}`),
    "",
    `Услуги: ${fmt(sub)}`,
    `Сервисный сбор 10%: ${fmt(fee)}`,
    `Итого (ориентировочно): ${fmt(total)}`,
  ].join("\n");
  const fallback = () => {
    out.textContent = "Скопируйте текст вручную:";
    let ta = basketEl.querySelector("textarea.fallback");
    if (!ta) { ta = document.createElement("textarea"); ta.className = "fallback"; ta.readOnly = true; out.after(ta); }
    ta.value = text; ta.focus(); ta.select();
  };
  try {
    navigator.clipboard.writeText(text).then(() => { out.textContent = "Скопировано. Отправьте менеджеру в Telegram или WhatsApp."; }, fallback);
  } catch (e) { fallback(); }
});

/* ======================= time of day (4D) ======================= */
const KEYS = [
  { h: 5.0,  top: 0x0b1630, hor: 0x3a3552, sun: 0xff9a6b, si: 0.0,  hemi: 0.28, night: 0.9 },
  { h: 6.3,  top: 0x3b5a8c, hor: 0xf3a683, sun: 0xffb07a, si: 0.7,  hemi: 0.5,  night: 0.25 },
  { h: 9.0,  top: 0x3f86c9, hor: 0xbfe0ef, sun: 0xfff1dc, si: 1.25, hemi: 0.8,  night: 0 },
  { h: 13.0, top: 0x2f7fd0, hor: 0xcfe8f3, sun: 0xffffff, si: 1.45, hemi: 0.9,  night: 0 },
  { h: 16.8, top: 0x3c6fb0, hor: 0xf6d2a2, sun: 0xffd29a, si: 1.2,  hemi: 0.75, night: 0 },
  { h: 18.2, top: 0x2c3f75, hor: 0xf08a5d, sun: 0xff7a45, si: 0.75, hemi: 0.5,  night: 0.25 },
  { h: 19.3, top: 0x1a2250, hor: 0x7b4a78, sun: 0xff6a50, si: 0.15, hemi: 0.35, night: 0.7 },
  { h: 20.8, top: 0x0a1230, hor: 0x26294a, sun: 0xff6a50, si: 0.0,  hemi: 0.24, night: 1 },
  { h: 24.0, top: 0x050a1c, hor: 0x151a33, sun: 0xff6a50, si: 0.0,  hemi: 0.2,  night: 1 },
];
function sampleTime(h) {
  let a = KEYS[0], b = KEYS[KEYS.length - 1];
  for (let i = 0; i < KEYS.length - 1; i++) if (h >= KEYS[i].h && h <= KEYS[i + 1].h) { a = KEYS[i]; b = KEYS[i + 1]; break; }
  const t = b.h === a.h ? 0 : (h - a.h) / (b.h - a.h);
  const c = (x, y) => new THREE.Color(x).lerp(new THREE.Color(y), t);
  const l = (x, y) => x + (y - x) * t;
  return { top: c(a.top, b.top), hor: c(a.hor, b.hor), sun: c(a.sun, b.sun), si: l(a.si, b.si), hemi: l(a.hemi, b.hemi), night: l(a.night, b.night) };
}
function phaseName(h) {
  if (h < 6.8) return "рассвет";
  if (h < 11) return "утро";
  if (h < 16) return "день";
  if (h < 19.3) return "закат";
  if (h < 21) return "сумерки";
  return "ночь";
}

/* ========================== sound (5D) ========================== */
let audio = null;
const soundBtn = document.getElementById("soundBtn");
function startAudio() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const len = ctx.sampleRate * 3;
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
  const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 600;
  const surf = ctx.createGain(); surf.gain.value = 0.35;
  const lfo = ctx.createOscillator(); lfo.frequency.value = 0.09;
  const lfoGain = ctx.createGain(); lfoGain.gain.value = 0.3;
  lfo.connect(lfoGain).connect(surf.gain);
  const master = ctx.createGain(); master.gain.value = 0;
  src.connect(lp).connect(surf).connect(master).connect(ctx.destination);
  // цикады ночью
  const cic = ctx.createOscillator(); cic.frequency.value = 4700;
  const cicAm = ctx.createGain(); cicAm.gain.value = 0;
  const pulse = ctx.createOscillator(); pulse.type = "square"; pulse.frequency.value = 38;
  const pulseGain = ctx.createGain(); pulseGain.gain.value = 0.5;
  pulse.connect(pulseGain).connect(cicAm.gain);
  const cicLevel = ctx.createGain(); cicLevel.gain.value = 0;
  cic.connect(cicAm).connect(cicLevel).connect(master);
  [src, lfo, cic, pulse].forEach(n => n.start());
  master.gain.linearRampToValueAtTime(0.8, ctx.currentTime + 2);
  return { ctx, master, cicLevel };
}
soundBtn.addEventListener("click", () => {
  try {
    if (!audio) audio = startAudio();
    const on = soundBtn.getAttribute("aria-pressed") !== "true";
    soundBtn.setAttribute("aria-pressed", String(on));
    soundBtn.textContent = on ? "Звук моря · вкл" : "Звук моря";
    if (on) audio.ctx.resume(); else audio.ctx.suspend();
  } catch (e) { soundBtn.textContent = "Звук недоступен"; }
});

function initScene() {
  const canvas = document.getElementById("scene");
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xf08a5d, 90, 520);
  camera = new THREE.PerspectiveCamera(48, 1, 0.5, 2000);

  // --- sky ---
  sky = new THREE.Mesh(
    new THREE.SphereGeometry(900, 32, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: { uTop: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uSun: { value: new THREE.Color() }, uSunDir: { value: new THREE.Vector3() }, uNight: { value: 0 } },
      vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        uniform vec3 uTop, uHor, uSun, uSunDir; uniform float uNight; varying vec3 vDir;
        void main(){
          vec3 d = normalize(vDir);
          float h = d.y;
          vec3 col = mix(uHor, uTop, pow(clamp(h,0.0,1.0), 0.55));
          if (h < 0.0) col = mix(uHor, uHor*0.55, clamp(-h*4.0,0.0,1.0));
          float s = dot(d, normalize(uSunDir));
          col += uSun * (smoothstep(0.9993, 0.9997, s) * 1.6 + pow(max(s,0.0), 48.0) * 0.45 + pow(max(s,0.0), 5.0) * 0.12) * (1.0 - uNight*0.9);
          float m = dot(d, normalize(vec3(-0.3, 0.3, -0.9)));
          col += vec3(0.85,0.88,0.95) * smoothstep(0.9982, 0.9987, m) * uNight;
          col += vec3(0.5,0.55,0.7) * pow(max(m,0.0), 90.0) * 0.25 * uNight;
          gl_FragColor = vec4(col, 1.0);
        }`,
    })
  );
  sky.renderOrder = -2;
  scene.add(sky);

  // --- stars ---
  const sp = [];
  for (let i = 0; i < 1400; i++) {
    const u = Math.random() * Math.PI * 2, v = Math.random() * 0.9 + 0.08;
    const r = 850;
    sp.push(Math.cos(u) * Math.sqrt(1 - v * v) * r, v * r, Math.sin(u) * Math.sqrt(1 - v * v) * r);
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute("position", new THREE.Float32BufferAttribute(sp, 3));
  stars = new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false }));
  stars.renderOrder = -1;
  scene.add(stars);

  // --- sea ---
  const seaGeo = new THREE.PlaneGeometry(1400, 1400, 220, 220);
  seaGeo.rotateX(-Math.PI / 2);
  sea = new THREE.Mesh(seaGeo, new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uDeep: { value: new THREE.Color(0x0b3b44) }, uSky: { value: new THREE.Color() }, uSun: { value: new THREE.Color() }, uSunDir: { value: new THREE.Vector3() }, uFog: { value: new THREE.Color() }, uNight: { value: 0 } },
    vertexShader: `
      uniform float uTime; varying vec3 vWorld; varying vec3 vN;
      float h(vec2 p){ return sin(p.x*0.075+uTime*0.8)*0.32 + sin(p.y*0.11+uTime*1.05)*0.26 + sin((p.x+p.y)*0.23+uTime*1.6)*0.10 + sin((p.x-p.y*0.6)*0.41+uTime*2.3)*0.05; }
      void main(){
        vec4 wp = modelMatrix * vec4(position,1.0);
        float e = 0.6;
        float hx = h(wp.xz+vec2(e,0.0)) - h(wp.xz-vec2(e,0.0));
        float hz = h(wp.xz+vec2(0.0,e)) - h(wp.xz-vec2(0.0,e));
        vN = normalize(vec3(-hx, 2.0*e, -hz));
        wp.y += h(wp.xz);
        vWorld = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      uniform vec3 uDeep, uSky, uSun, uSunDir, uFog; uniform float uNight;
      varying vec3 vWorld; varying vec3 vN;
      void main(){
        vec3 V = normalize(cameraPosition - vWorld);
        vec3 N = normalize(vN);
        float fres = pow(1.0 - max(dot(N,V),0.0), 3.0);
        vec3 deep = uDeep * (1.0 - uNight*0.75);
        vec3 col = mix(deep, uSky, fres*0.85 + 0.06);
        vec3 R = reflect(-normalize(uSunDir), N);

        float d = length(cameraPosition.xz - vWorld.xz);
        col = mix(col, uFog, smoothstep(90.0, 520.0, d));
        gl_FragColor = vec4(col, 1.0);
      }`,
  }));
  scene.add(sea);

  // --- lights ---
  hemi = new THREE.HemisphereLight(0xcfe8f3, 0x3a3226, 0.6);

  scene.add(sunLight, sunLight.target);

  buildWorld();
  const w = WAYPOINTS.home;
  camPos.set(...w.pos); camLook.set(...w.look);
}

function mat(color, extra = {}) { return new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...extra }); }
function box(w, h, d, m, x, y, z, parent = scene) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y, z); mesh.castShadow = true; mesh.receiveShadow = true;
  parent.add(mesh); return mesh;
}

function palm(x, z, h = 7, lean = 0.12) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.3, h, 7), mat(0x7a6048));
  trunk.position.y = h / 2; trunk.castShadow = true; g.add(trunk);
  const leafMat = mat(0x3f6b3a, { flatShading: true, side: THREE.DoubleSide });
  for (let i = 0; i < 7; i++) {
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.55, 4.2, 4, 1, true), leafMat);
    leaf.geometry.translate(0, 2.1, 0);
    leaf.position.y = h;
    leaf.rotation.set(Math.PI / 2 - 0.55, i / 7 * Math.PI * 2, 0, "YXZ");
    leaf.castShadow = true; g.add(leaf);
  }
  g.position.set(x, 6, z); g.rotation.z = lean; g.rotation.y = Math.random() * 6;
  scene.add(g);
}

function lounger(x, z, ry = 0) {

  // islands in the bay
  const isl = mat(0x2f4a3a, { flatShading: true, roughness: 1 });
  [[-150, -6, 280, 70, 24, 36], [140, -5, 320, 60, 20, 30], [55, -3, 170, 20, 9, 14], [-40, -3, 360, 38, 15, 20]].forEach(([x, y, z, sx, sy, sz]) => {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), isl);
    m.scale.set(sx, sy, sz); m.position.set(x, y, z); scene.add(m);
  });
  // hills behind the villa
  const hill = mat(0x4d6a43, { flatShading: true, roughness: 1 });
  [[-60, -140, 70, 40, 40], [30, -170, 90, 55, 50], [110, -130, 60, 34, 40]].forEach(([x, z, sx, sy, sz]) => {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), hill);
    m.scale.set(sx, sy, sz); m.position.set(x, 0, z); scene.add(m);
  });
}

function applyTime(h, t) {
  const s = sampleTime(h);
  const a = (h - 6) / 12 * Math.PI;
  const sunDir = new THREE.Vector3(0.35, Math.sin(a), Math.cos(a)).normalize();
  const moonDir = new THREE.Vector3(-0.3, 0.3, -0.9).normalize();
  sky.material.uniforms.uTop.value.copy(s.top);
  sky.material.uniforms.uHor.value.copy(s.hor);
  sky.material.uniforms.uSun.value.copy(s.sun);
  sky.material.uniforms.uSunDir.value.copy(sunDir);
  sky.material.uniforms.uNight.value = s.night;
  scene.fog.color.copy(s.hor);
  const su = sea.material.uniforms;
  su.uTime.value = t; su.uSky.value.copy(s.hor).lerp(s.top, 0.35); su.uSun.value.copy(s.sun); su.uSunDir.value.copy(sunDir); su.uFog.value.copy(s.hor); su.uNight.value = s.night;
  stars.material.opacity = Math.max(0, s.night - 0.3) * 1.3;

  const useMoon = sunDir.y < 0.02;
  sunLight.position.copy(useMoon ? moonDir : sunDir).multiplyScalar(160).add(new THREE.Vector3(0, 0, -10));
  sunLight.target.position.set(0, 0, -10);
  sunLight.color.copy(useMoon ? new THREE.Color(0x9fb4e0) : s.sun);
  sunLight.intensity = useMoon ? 0.22 * s.night : s.si;
  hemi.intensity = s.hemi;
  hemi.color.copy(s.top).lerp(new THREE.Color(0xffffff), 0.4);

  glassMat.emissiveIntensity = s.night * 0.9;
  poolMat.emissiveIntensity = 0.1 + s.night * 0.55;
  lanternLights.forEach(l => { l.intensity = s.night * 2.2; });
  lampMat.color.setRGB(1, 0.79, 0.54).multiplyScalar(0.35 + s.night * 0.9);
  padLights.color.setRGB(0.62, 0.83, 1).multiplyScalar(0.3 + s.night);
  if (audio) audio.cicLevel.gain.setTargetAtTime(Math.max(0, s.night - 0.4) * 0.035, audio.ctx.currentTime, 0.5);
}

/* ========================= navigation ========================= */
function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function goTo(id) {
  if (!WAYPOINTS[id]) return;
  state.room = id;
  card.classList.add("swap");
  setTimeout(() => { renderCard(); card.classList.remove("swap"); }, reduceMotion ? 0 : 260);
  if (!renderer) return;
  const w = WAYPOINTS[id];
  const toPos = new THREE.Vector3(...w.pos), toLook = new THREE.Vector3(...w.look);
  if (reduceMotion) { camPos.copy(toPos); camLook.copy(toLook); flight = null; return; }
  flight = { fromPos: camPos.clone(), fromLook: camLook.clone(), toPos, toLook, start: performance.now(), dur: 2400 };
}
function step(dir) {
  const i = ORDER.indexOf(state.room);
  goTo(ORDER[(i + dir + ORDER.length) % ORDER.length]);
}
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
});
let wheelLock = 0;
document.getElementById("scene").addEventListener("wheel", e => {
  const now = performance.now();
  if (now < wheelLock || Math.abs(e.deltaY) < 12) return;
  wheelLock = now + 1400;
  step(e.deltaY > 0 ? 1 : -1);
}, { passive: true });
addEventListener("pointermove", e => {
  mouse.x = e.clientX / innerWidth * 2 - 1;
  mouse.y = e.clientY / innerHeight * 2 - 1;
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 64 : 48;
  camera.updateProjectionMatrix();
}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  const t = now / 1000;
  if (playing) {
    hour += dt / 7;
    if (hour > 23.9) hour = 5;
    hourInput.value = hour;
  }
  updateClockLabel();
  applyTime(hour, t);

  if (flight) {
    const k = Math.min(1, (now - flight.start) / flight.dur), e = ease(k);
    camPos.lerpVectors(flight.fromPos, flight.toPos, e);
    camPos.y += Math.sin(Math.PI * e) * 9;
    camLook.lerpVectors(flight.fromLook, flight.toLook, e);
    if (k >= 1) flight = null;
  }
  const m = reduceMotion ? 0 : 1;
  mouse.sx += (mouse.x - mouse.sx) * 0.04; mouse.sy += (mouse.y - mouse.sy) * 0.04;
  const drift = m * Math.sin(t * 0.12) * 1.6;
  camera.position.set(camPos.x + mouse.sx * 2.5 * m + drift, camPos.y - mouse.sy * 1.2 * m, camPos.z);
  camera.lookAt(camLook.x + mouse.sx * 1.2 * m, camLook.y - mouse.sy * 0.6 * m, camLook.z);
  sky.position.copy(camera.position);
  stars.position.copy(camera.position);

  yacht.position.y = -0.3 + Math.sin(t * 0.9) * 0.12 * m;
  yacht.rotation.z = Math.sin(t * 0.7) * 0.025 * m;
  yacht.rotation.x = Math.sin(t * 0.55) * 0.015 * m;

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

renderCard();
renderBasket();
updateClockLabel();
try {
  if (typeof THREE === "undefined") throw new Error("three.js не загрузился");
  initScene();
  resize();
  addEventListener("resize", resize);
  requestAnimationFrame(frame);
} catch (e) {
  const d = document.createElement("div");
  d.className = "nowebgl";
  d.textContent = "Ваш браузер не показывает 3D. Комнаты и расчёт пребывания работают как обычно.";
  document.body.prepend(d);
}
</script>
